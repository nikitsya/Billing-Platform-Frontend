<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="#0b6b3a" name="theme-color"/>
    <meta content="../icons/icon-192.png" name="msapplication-TileImage"/>
    <link href="../icons/icon-32.png" rel="icon" sizes="32x32" type="image/png"/>
    <link href="../icon.png" rel="icon" sizes="512x512" type="image/png"/>
    <link href="../icons/icon-32.png" rel="shortcut icon" type="image/png"/>
    <link href="../icons/icon-180.png" rel="apple-touch-icon" sizes="180x180"/>
    <link href="../manifest.webmanifest" rel="manifest"/>
    <title>Overview | Billing Platform</title>
    <link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<aside class="sidebar" data-active-page="overview"></aside>

<main>
    <header class="topbar">
        <div>
            <p class="eyebrow">Operations workspace</p>
            <h1>Billing dashboard</h1>
        </div>
        <p class="topbar-note">Customers, plans and recurring billing in one place.</p>
    </header>

    <section aria-labelledby="overviewTitle" class="section overview-section" id="overview">
        <div class="section-heading">
            <div>
                <p class="section-number">01 / Overview</p>
                <h2 id="overviewTitle">Account activity</h2>
            </div>
            <p>Live totals from the billing API.</p>
        </div>

        <div aria-live="polite" class="metrics">
            <article class="metric">
                <span>Customers</span>
                <strong id="customerCount">—</strong>
                <a href="../customers/">Manage customers</a>
            </article>
            <article class="metric">
                <span>Products</span>
                <strong id="productCount">—</strong>
                <a href="../products-and-prices/">View catalogue</a>
            </article>
            <article class="metric">
                <span>Prices</span>
                <strong id="priceCount">—</strong>
                <a href="../products-and-prices/">Compare prices</a>
            </article>
            <article class="metric metric-accent">
                <span>Subscriptions</span>
                <strong id="subscriptionCount">—</strong>
                <a href="../subscriptions/">Manage subscriptions</a>
            </article>
        </div>
    </section>
</main>

<script src="../index.js" type="module"></script>
</body>
</html>
