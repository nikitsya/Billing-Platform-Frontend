<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="#ffffff" name="theme-color"/>
    <meta content="./icons/icon-192.png" name="msapplication-TileImage"/>
    <link href="./icons/icon-32.png" rel="icon" sizes="32x32" type="image/png"/>
    <link href="./icon.png" rel="icon" sizes="512x512" type="image/png"/>
    <link href="./icons/icon-32.png" rel="shortcut icon" type="image/png"/>
    <link href="./icons/icon-180.png" rel="apple-touch-icon" sizes="180x180"/>
    <link href="./manifest.webmanifest" rel="manifest"/>
    <title>Billing Platform Demo</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<button id="pingButton" type="button">Ping</button>

<h1>Create customer</h1>
<form id="customerForm">
    <label for="name"></label>
    <input id="name" name="name" placeholder="Name" required/>

    <label for="email"></label>
    <input id="email" name="email" placeholder="Email" required type="email"/>

    <button type="submit">Create</button>
</form>

<button id="allCustomersButton" type="button">All Customers</button>
<button id="allProductsButton" type="button">All Products</button>
<button id="allPricesButton" type="button">All Prices</button>

<div aria-live="polite" id="result" role="status"></div>

<script src="index.js" type="module"></script>
</body>
</html>
