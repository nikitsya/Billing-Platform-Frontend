<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="#0b6b3a" name="theme-color"/>
    <meta content="../icons/icon-192.png" name="msapplication-TileImage"/>
    <link href="../icons/icon-32.png" rel="icon" sizes="32x32" type="image/png"/>
    <link href="../icon.png" rel="icon" sizes="512x512" type="image/png"/>
    <link href="../icons/icon-32.png" rel="shortcut icon" type="image/png"/>
    <link href="../icons/icon-180.png" rel="apple-touch-icon" sizes="180x180"/>
    <link href="../manifest.webmanifest" rel="manifest"/>
    <title>Payments | Billing Platform</title>
    <link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<aside class="sidebar" data-active-page="payments"></aside>

<main>
    <header class="topbar">
        <div>
            <p class="eyebrow">Operations workspace</p>
            <h1>Payments</h1>
        </div>
        <p class="topbar-note">One-off charges and payment intent confirmation.</p>
    </header>

    <section aria-labelledby="paymentsTitle" class="section" id="payments">
        <div class="section-heading">
            <div>
                <p class="section-number">05 / Payments</p>
                <h2 id="paymentsTitle">Payment intents</h2>
            </div>
            <button class="secondary-button" id="allPaymentsButton" type="button">Refresh payments</button>
        </div>

        <div class="payment-layout">
            <form class="payment-form" id="paymentForm">
                <div>
                    <p class="panel-kicker">New payment</p>
                    <h3>Create payment</h3>
                </div>

                <label for="paymentCustomer">Customer</label>
                <select id="paymentCustomer" name="customerId" required>
                    <option value="">Select customer</option>
                </select>

                <label for="paymentPrice">One-time price</label>
                <select id="paymentPrice" name="priceId">
                    <option value="">Manual amount</option>
                </select>

                <div class="field-grid">
                    <div>
                        <label for="paymentAmount">Amount</label>
                        <input id="paymentAmount" inputmode="decimal" min="0.01" name="amount" placeholder="49.99"
                               required step="0.01" type="number"/>
                    </div>
                    <div>
                        <label for="paymentCurrency">Currency</label>
                        <select id="paymentCurrency" name="currency" required>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                </div>

                <button class="primary-button" type="submit">Create payment</button>
                <p aria-live="polite" class="form-status" id="paymentFormStatus"></p>
            </form>

            <div class="data-panel payment-panel">
                <div class="panel-header">
                    <div>
                        <h3>All payment intents</h3>
                        <p id="paymentSummary">Loading payment intents...</p>
                    </div>
                </div>

                <div class="table-scroll">
                    <table>
                        <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Customer</th>
                            <th scope="col">Amount</th>
                            <th scope="col">Status</th>
                            <th scope="col">Created</th>
                            <th scope="col">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="paymentRows">
                        <tr>
                            <td class="empty-state" colspan="6">Loading payment intents...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="../index.js" type="module"></script>
</body>
</html>
